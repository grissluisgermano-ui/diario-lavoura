# Atualiza toda semana a lista de defensivos do AGROFIT (MAPA) usada pelo app para preencher o princípio ativo.
name: AGROFIT semanal
on:
  schedule:
    - cron: "17 9 * * 2"   # terças, ~6h de Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node automacao/agrofit/atualiza.mjs
      - name: Gravar se mudou
        run: |
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/agrofit.json dados/agrofit-manifest.json
            git commit -m "AGROFIT: lista atualizada"
            git push
          fi
